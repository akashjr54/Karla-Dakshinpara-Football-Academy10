<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARRA - Karra South Para Football Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #0f172a; color: #fff; }
        .card-aspect { aspect-ratio: 3/4; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="document.getElementById('logoInput').click()" title="লোগো পরিবর্তন করতে ক্লিক করুন">
                <img id="headerLogo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230b4f28'/><text x='50%' y='55%' font-size='20' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle'>KARRA</text></svg>" alt="Logo" class="w-12 h-12 object-contain rounded-full border-2 border-emerald-500 shadow-lg">
                <input type="file" id="logoInput" accept="image/*" class="hidden" onchange="changeLogo(event)">
                <div>
                    <h1 class="font-extrabold text-lg tracking-wider text-emerald-400">KARRA</h1>
                    <p class="text-xs text-slate-400">করড়া দক্ষিণপাড়া ফুটবল একাডেমি</p>
                </div>
            </div>
            <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2 shadow transition">
                <i class="fa-solid fa-plus"></i>
                <span>প্লেয়ার যোগ করুন</span>
            </button>
        </div>
    </header>

    <!-- Sponsor / Promo Banner Section -->
    <section class="max-w-7xl mx-auto px-4 my-4">
        <div class="relative bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl group">
            <div id="bannerContainer" class="w-full h-48 md:h-64 bg-slate-800 flex items-center justify-center cursor-pointer relative" onclick="document.getElementById('bannerInput').click()">
                <img id="bannerImage" src="" alt="Sponsor Banner" class="w-full h-full object-cover hidden">
                <div id="bannerPlaceholder" class="text-center p-6">
                    <i class="fa-solid fa-image text-4xl text-emerald-500 mb-2"></i>
                    <p class="text-sm font-semibold text-slate-300">বিশেষ ব্যানার বা অ্যাড যোগ করতে এখানে ক্লিক করুন</p>
                    <span class="text-xs text-slate-500">টুর্নামেন্ট পোস্টার বা স্পন্সর ব্যানার</span>
                </div>
            </div>
            <input type="file" id="bannerInput" accept="image/*" class="hidden" onchange="changeBanner(event)">
            <div class="absolute bottom-2 right-2 bg-slate-950/80 px-3 py-1 rounded-md text-xs text-slate-300 backdrop-blur-sm pointer-events-none">
                স্পন্সর / প্রোমো ব্যানার
            </div>
        </div>
    </section>

    <!-- Squad Section -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black tracking-wide uppercase border-l-4 border-emerald-500 pl-3">অফিসিয়াল স্কোয়াড</h2>
            <span id="playerCount" class="text-sm text-slate-400">মোট প্লেয়ার: ০</span>
        </div>

        <!-- Players Grid -->
        <div id="playersGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Dynamic Players Rendered Here -->
        </div>
    </main>

    <!-- Add Player Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <h3 class="text-xl font-bold mb-4 text-emerald-400">নতুন প্লেয়ার যুক্ত করুন</h3>
            <form id="playerForm" onsubmit="savePlayer(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">প্লেয়ারের ছবি (3:4 Ratio)</label>
                    <input type="file" id="playerImageInput" accept="image/*" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">জার্সি নম্বর (Number)</label>
                    <input type="number" id="playerNumber" placeholder="যেমন: ১৭" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-sm hover:bg-slate-700">বাতিল</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700">সংরক্ষণ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Player Modal -->
    <div id="viewModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4" onclick="closeViewModal(event)">
        <div class="relative max-w-sm w-full bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl text-center p-6" onclick="event.stopPropagation()">
            <button onclick="closeViewModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-xl bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center">×</button>
            <div class="card-aspect w-full rounded-xl overflow-hidden mb-4 bg-slate-950 shadow-inner">
                <img id="viewImage" src="" alt="Player" class="w-full h-full object-cover">
            </div>
            <div class="text-5xl font-black text-emerald-400 mb-6" id="viewNumber">#0</div>
            <button id="deletePlayerBtn" onclick="" class="w-full bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white py-2.5 rounded-lg text-sm font-semibold transition border border-red-600/30">
                প্লেয়ার ডিলিট করুন
            </button>
        </div>
    </div>

    <script>
        // LocalStorage Data Management
        let players = JSON.parse(localStorage.getItem('karra_players')) || [];
        let savedLogo = localStorage.getItem('karra_logo');
        let savedBanner = localStorage.getItem('karra_banner');

        if(savedLogo) document.getElementById('headerLogo').src = savedLogo;
        if(savedBanner) {
            const bannerImg = document.getElementById('bannerImage');
            bannerImg.src = savedBanner;
            bannerImg.classList.remove('hidden');
            document.getElementById('bannerPlaceholder').classList.add('hidden');
        }

        renderPlayers();

        // Change Logo
        function changeLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('headerLogo').src = e.target.result;
                    localStorage.setItem('karra_logo', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }

        // Change Banner
        function changeBanner(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const bannerImg = document.getElementById('bannerImage');
                    bannerImg.src = e.target.result;
                    bannerImg.classList.remove('hidden');
                    document.getElementById('bannerPlaceholder').classList.add('hidden');
                    localStorage.setItem('karra_banner', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }

        // Modals Control
        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('playerForm').reset(); }
        
        function openViewModal(index) {
            const player = players[index];
            document.getElementById('viewImage').src = player.image;
            document.getElementById('viewNumber').innerText = '#' + player.number;
            document.getElementById('deletePlayerBtn').setAttribute('onclick', `deletePlayer(${index})`);
            document.getElementById('viewModal').classList.remove('hidden');
        }
        function closeViewModal() { document.getElementById('viewModal').classList.add('hidden'); }

        // Save Player
        function savePlayer(event) {
            event.preventDefault();
            const fileInput = document.getElementById('playerImageInput');
            const number = document.getElementById('playerNumber').value;
            
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    players.push({ image: e.target.result, number: number });
                    localStorage.setItem('karra_players', JSON.stringify(players));
                    renderPlayers();
                    closeAddModal();
                }
                reader.readAsDataURL(file);
            }
        }

        // Delete Player
        function deletePlayer(index) {
            if(confirm('আপনি কি নিশ্চিত এই প্লেয়ারকে স্কোয়াড থেকে বাদ দিতে চান?')) {
                players.splice(index, 1);
                localStorage.setItem('karra_players', JSON.stringify(players));
                closeViewModal();
                renderPlayers();
            }
        }

        // Render Players
        function renderPlayers() {
            const grid = document.getElementById('playersGrid');
            document.getElementById('playerCount').innerText = 'মোট প্লেয়ার: ' + players.length;
            
            if(players.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">কোনো প্লেয়ার যুক্ত করা হয়নি। উপরে "+ প্লেয়ার যোগ করুন" বাটনে ক্লিক করুন।</div>`;
                return;
            }

            grid.innerHTML = '';
            players.forEach((player, index) => {
                grid.innerHTML += `
                    <div onclick="openViewModal(${index})" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg cursor-pointer transform hover:-translate-y-1 transition duration-200 group">
                        <div class="card-aspect w-full bg-slate-950 overflow-hidden relative">
                            <img src="${player.image}" alt="Player" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-4 text-center bg-gradient-to-t from-slate-900 to-slate-900/80">
                            <span class="text-2xl font-black text-emerald-400 tracking-wider">#${player.number}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
