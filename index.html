<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কররা দক্ষিণপাড়া ফুটবল একাডেমি</title>
    <style>
        :root {
            --primary-green: #0d4a2b;
            --accent-red: #c8102e;
            --dark-bg: #111b15;
            --card-bg: #1a2c22;
            --text-light: #ffffff;
            --text-gray: #b0c4b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary-green), #062b18);
            border-bottom: 4px solid var(--accent-red);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--text-light);
            object-fit: cover;
        }

        .brand h1 {
            font-size: 1.2rem;
            color: var(--text-light);
        }

        .admin-btn {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Banner Slider */
        .slider-container {
            position: relative;
            max-width: 1000px;
            margin: 20px auto;
            height: 280px;
            overflow: hidden;
            border-radius: 10px;
            border: 2px solid var(--primary-green);
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-caption {
            position: absolute;
            bottom: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        /* Position Filters */
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: 1px solid var(--primary-green);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* Squad Section */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 15px 40px 15px;
        }

        .section-title {
            text-align: center;
            margin: 30px 0 20px 0;
            font-size: 1.5rem;
            color: var(--text-light);
            border-bottom: 2px solid var(--primary-green);
            display: inline-block;
            padding-bottom: 5px;
        }

        .squad-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #243d2e;
            text-align: center;
            position: relative;
            transition: transform 0.3s;
        }

        .player-card:hover {
            transform: translateY(-5px);
        }

        .player-img-box {
            width: 100%;
            height: 220px;
            background-color: #0c1811;
            position: relative;
            overflow: hidden;
        }

        .player-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: var(--accent-red);
            color: white;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .player-info {
            padding: 15px;
        }

        .player-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .player-pos {
            font-size: 0.85rem;
            color: var(--text-gray);
            text-transform: uppercase;
        }

        /* Modal for Editing */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--primary-green);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            background: var(--dark-bg);
            border: 1px solid #334e3d;
            color: white;
            border-radius: 5px;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-save {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Footer */
        footer {
            background-color: #08110b;
            border-top: 2px solid var(--primary-green);
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        footer p {
            margin: 5px 0;
        }

        .editable-trigger {
            cursor: pointer;
            border: 1px dashed rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="65951.jpg" alt="Logo" id="headerLogo" class="editable-trigger" title="Click to change logo">
            <h1>কররা দক্ষিণপাড়া ফুটবল একাডেমি</h1>
        </div>
        <button class="admin-btn" onclick="openAdminModal()">কাস্টমাইজ প্যানেল</button>
    </header>

    <!-- Slider Section -->
    <div class="slider-container" id="sliderContainer">
        <!-- Slides will be dynamically rendered -->
    </div>

    <div class="container">
        <div style="text-align: center;">
            <h2 class="section-title">স্কোয়াড ও খেলোয়াড়বৃন্দ</h2>
        </div>

        <!-- Position Filters -->
        <div class="filters">
            <button class="filter-btn active" onclick="filterPlayers('all')">সবাই</button>
            <button class="filter-btn" onclick="filterPlayers('Goalkeeper')">গোলকিপার</button>
            <button class="filter-btn" onclick="filterPlayers('Defender')">ডিফেন্ডার</button>
            <button class="filter-btn" onclick="filterPlayers('Midfielder')">মিডফিল্ডার</button>
            <button class="filter-btn" onclick="filterPlayers('Forward')">স্ট্রাইকার/ফরোয়ার্ড</button>
        </div>

        <!-- Players Grid -->
        <div class="squad-grid" id="squadGrid">
            <!-- Player cards will be dynamically rendered -->
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p><strong>লোকেশন:</strong> কররা গ্রাম, আজিম নগর ইউনিয়ন, ভাঙ্গা, ফরিদপুর</p>
        <p><strong>যোগাযোগ:</strong> 01700000000</p>
        <p>&copy; ২০২৬ কররা দক্ষিণপাড়া ফুটবল একাডেমি</p>
    </footer>

    <!-- Edit Player Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 id="modalTitle">খেলোয়াড় এডিট করুন</h2>
            <input type="hidden" id="editPlayerId">
            <div class="form-group">
                <label>নাম:</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>জার্সি নাম্বার:</label>
                <input type="text" id="editNumber">
            </div>
            <div class="form-group">
                <label>পজিশন:</label>
                <select id="editPosition">
                    <option value="Goalkeeper">গোলকিপার</option>
                    <option value="Defender">ডিফেন্ডার</option>
                    <option value="Midfielder">মিডফিল্ডার</option>
                    <option value="Forward">ফরোয়ার্ড</option>
                </select>
            </div>
            <div class="form-group">
                <label>গ্যালারি থেকে ছবি সিলেক্ট করুন:</label>
                <input type="file" id="editImageFile" accept="image/*">
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">বাতিল</button>
                <button class="btn-save" onclick="savePlayerChanges()">সংরক্ষণ করুন</button>
            </div>
        </div>
    </div>

    <script>
        // Initial Data
        let bannerImages = [
            { img: "65951.jpg", caption: "কররা দক্ষিণপাড়া ফুটবল একাডেমি - ফাইটার্স" },
            { img: "65951.jpg", caption: "আমাদের গৌরব, আমাদের ফুটবল" }
        ];

        let players = [
            { id: 1, name: "আকাশ", number: "১৭", position: "Goalkeeper", img: "65951.jpg" },
            { id: 2, name: "রহিম", number: "৪", position: "Defender", img: "65951.jpg" },
            { id: 3, name: "করিম", number: "৮", position: "Midfielder", img: "65951.jpg" },
            { id: 4, name: "জনি", number: "১০", position: "Forward", img: "65951.jpg" }
        ];

        let currentSlide = 0;

        // Render Slider
        function renderSlider() {
            const container = document.getElementById('sliderContainer');
            container.innerHTML = bannerImages.map((b, index) => `
                <div class="slide ${index === 0 ? 'active' : ''}">
                    <img src="${b.img}" alt="Banner">
                    <div class="slide-caption">${b.caption}</div>
                </div>
            `).join('');
        }

        // Auto slide every 3 seconds
        setInterval(() => {
            const slides = document.querySelectorAll('.slide');
            if(slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 3000);

        // Render Players
        function renderPlayers(filter = 'all') {
            const grid = document.getElementById('squadGrid');
            const filtered = filter === 'all' ? players : players.filter(p => p.position === filter);
            
            grid.innerHTML = filtered.map(p => `
                <div class="player-card" onclick="openEditModal(${p.id})" title="ছবি বা নাম மாற்ற করতে ক্লিক করুন">
                    <div class="player-img-box">
                        <span class="player-number">#${p.number}</span>
                        <img src="${p.img}" alt="${p.name}">
                    </div>
                    <div class="player-info">
                        <div class="player-name">${p.name}</div>
                        <div class="player-pos">${p.position}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterPlayers(pos) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderPlayers(pos);
        }

        // Modal Controls
        function openEditModal(id) {
            const player = players.find(p => p.id === id);
            document.getElementById('editPlayerId').value = player.id;
            document.getElementById('editName').value = player.name;
            document.getElementById('editNumber').value = player.number;
            document.getElementById('editPosition').value = player.position;
            document.getElementById('editImageFile').value = ""; // Reset file input
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function savePlayerChanges() {
            const id = parseInt(document.getElementById('editPlayerId').value);
            const name = document.getElementById('editName').value;
            const number = document.getElementById('editNumber').value;
            const position = document.getElementById('editPosition').value;
            const fileInput = document.getElementById('editImageFile');

            const player = players.find(p => p.id === id);
            if (player) {
                player.name = name;
                player.number = number;
                player.position = position;

                if (fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        player.img = e.target.result;
                        renderPlayers();
                        closeModal();
                    }
                    reader.readAsDataURL(fileInput.files[0]);
                } else {
                    renderPlayers();
                    closeModal();
                }
            }
        }

        function openAdminModal() {
            alert("খেলোয়াড় পরিবর্তন করতে সরাসরি যেকোনো প্লেয়ার কার্ডের উপর টাচ বা ক্লিক করুন!");
        }

        // Initial Load
        renderSlider();
        renderPlayers();
    </script>
</body>
</html>
